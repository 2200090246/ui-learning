<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav {
            border: 0.5px solid gray;
            background-color: black;
            padding: 30px;
        }

        ul li {
            color: white;
            list-style-type: none;
            display: inline;
            margin-right: 20px;
            cursor: pointer;
        }

        nav h1 {
            color: navy;
        }

        .hero-image {
            height: 100vh;
            width: 100%;
            color: white;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url("https://static.vecteezy.com/system/resources/previews/071/978/766/large_2x/himalayan-valley-with-river-flowing-through-pine-tree-forest-photo.jpg");
        }

        .hero-image div {
            background-color: rgb(12, 53, 78);
            border-radius: 10px;
            padding-left: 10px;
        }

        button {
            background-color: rgb(209, 161, 73);
            border-radius: 10px;
            padding: 7px;
        }

        * {
            margin: 0;
            padding: 0;
        }

        .popular-destinations {
            background-color: black;
            height: 100px;
            color: white;
            text-align: center;
        }

        .popular-destinations p {
            color: gray;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: black;
        }

        .content div:first-child {
            width: 100%;
        }

        .content div:nth-child(2) {

            width: 49.5%;
            height: 400px;
            border-radius: 10px;
            background-image: url("https://cdn.pixabay.com/photo/2018/03/09/20/20/taj-mahal-3212516_1280.jpg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .content div:nth-child(3) {

            width: 49.5%;
            height: 400px;
            border-radius: 10px;
            background-image: url("https://images.openai.com/static-rsc-4/aQ0ltZN-3zmzAWdzFkAEkCx5P-ZDhFT1tkPuSEzpVbDZwns0CYR3snLxObfu8fa22v-BcLwBYt4MfdkgOhr36U5KIkqzN5Uj2dXaqIc__XNDyiwvC1GyL5tDk-qXTgC1rVuXbYSLCaU56fd5hYJ_ialCzzq0QM6p9BNhtRuSqezUt2p7WcWEYZSAo5KZ0fez?purpose=fullsize");
            background-size: 100% 100%;
            background-position: center;
        }
        .content div:nth-child(4){
            width: 49.5%;
            height: 20px;
            background-color: black;
            color: white;
        }
        .content div:nth-child(5){
             width: 49.5%;
            height: 50px;
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <nav>
        <h1>Exploe India</h1>
        <ul>
            <li>Home</li>
            <li>Destinations</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
    <div class="hero-image">
        <div>
            <h2>Discover the Beauty of India</h2><br>
            <p>Explore amazing destinations, experience new cultures, and create unforgettable memories.</p><br>
            <button>Explore Now</button>
        </div>
    </div>
    <div class="content">
        <div class="popular-destinations">
            <h2>Popular Destinations</h2>
            <p>Discover beautiful places across India</p>
        </div>
        <div>

        </div>

        <div>

        </div>
        <div class="destination">
            <h2>Agra</h2>
        </div>

        <div class="destination">
            <h2>Kerala</h2>
        </div>
    </div>
</body>

</html>
